name: PR Build Check

on:
  pull_request:
    branches:
      - main
      - release
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from the PR head
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Full history: the migration-immutability check diffs against the
          # merge base with the target branch.
          fetch-depth: 0

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install uv
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # Step 4: Install dependencies (dev extras for formatters)
      - name: Install dependencies
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv sync --extra dev

      # Step 5: Check code formatting with black (check-only mode)
      - name: Check black formatting
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run black --check --diff .
        continue-on-error: false

      # Step 6: Check import sorting with isort (check-only mode)
      - name: Check isort formatting
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run isort --check --diff . --profile black
        continue-on-error: false

      # Step 7: Check for unused imports with autoflake (check-only mode)
      - name: Check autoflake
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run autoflake --check --remove-all-unused-imports --remove-unused-variables --exclude "app/__init__.py,.venv/*,venv/*" -r app/
        continue-on-error: false

      # Step 8: Run pyrefly type check
      - name: Check pyrefly
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run pyrefly check
        continue-on-error: false

      # Step 9: Migration hygiene — duplicate numbers, gaps, naming.
      # On PRs the check unions with the CURRENT base branch, so two open
      # PRs claiming the same number collide at CI time instead of after
      # both merge (the 052 escape, 2026-08: this job checks out the PR
      # HEAD, so each PR saw only its own migration). The residual
      # stale-approval race is closed only by requiring branches to be
      # up to date before merging.
      - name: Check migration numbering
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin "${{ github.base_ref }}"
            uv run python scripts/check_migrations.py --base "origin/${{ github.base_ref }}"
          else
            uv run python scripts/check_migrations.py
          fi
        continue-on-error: false

      # Step 10: Applied migrations are immutable — PRs may only ADD files
      - name: Check migrations are never edited
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          # Sanctioned renames (already-merged duplicate numbers reconciled
          # by RENAMED_MIGRATIONS in scripts/migrate.py) are exempt. The
          # exemption list is DERIVED from that registry — it was a second
          # hardcoded copy here, and the 052→055 rename updated one and not
          # the other, so this guard failed the very PR that fixed the
          # duplicate. One registry, both guards.
          export PATH="$HOME/.cargo/bin:$PATH"
          SANCTIONED=$(uv run python scripts/check_migrations.py --print-sanctioned \
            | sed 's|^|app/database/migrations/|')
          CHANGED=$(git diff --diff-filter=MDR --name-only \
            "origin/${{ github.base_ref }}...HEAD" -- app/database/migrations/ \
            | grep -vxF -f <(echo "$SANCTIONED") || true)
          if [ -n "$CHANGED" ]; then
            echo "Migration files are immutable once merged. Modified/deleted/renamed:"
            echo "$CHANGED"
            echo "Write a new migration (next number) instead."
            exit 1
          fi
          echo "No existing migrations touched."

      # Step 11: CRM module boundaries — table ownership, SQL/driver
      # confinement, import direction, handle discipline (ADR 0001
      # amendment: one DB role, so the boundary is enforced in CI)
      - name: Check crm module boundaries
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run python scripts/check_crm_boundaries.py
        continue-on-error: false

      # Step 12: CRM law tests — pure (no DB): policy tables, liveness,
      # normalization, mirror dedupe, both CI guards' own rules
      - name: Run crm tests
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run pytest tests/crm -q
        continue-on-error: false

      # Step 13: Check commit count (must be exactly 1)
      - name: Check commit count
        if: github.event_name == 'pull_request'
        run: |
          COMMIT_COUNT=${{ github.event.pull_request.commits }}
          echo "Commit count: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -gt 1 ]; then
            echo "PR must contain exactly one commit."
            exit 1
          fi

          echo "Commit count is 1. Build successful."
