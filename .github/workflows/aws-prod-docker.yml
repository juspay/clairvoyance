name: Build & Push Docker Image to AWS ECR (PROD)

on:
  pull_request:
    branches:
      - release   # triggers when PR is created targeting release branch
    types: [opened, synchronize, reopened]  # triggers on PR creation and when commits are pushed to PR
  push:
    branches:
      - release   # triggers when you push to release branch

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      AWS_REPO: clairvoyance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials using access keys
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Build and Push Docker Image to AWS ECR (PROD)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_REPO }}:${{ env.SHORT_SHA }}
          provenance: false
          sbom: false
