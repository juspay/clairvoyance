[project]
name = "clairvoyance"
version = "0.1.0"
description = "Clairvoyance AI voice conversation platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "aiohttp>=3.8.4",
    "pytz==2025.2",
    "python-multipart>=0.0.6",
    "websockets>=11.0.3",
    "starlette>=0.27.0",
    "python-dotenv>=1.0.0",
    "pipecat-ai[daily,google,assemblyai,silero,openai,azure,elevenlabs,aic,anthropic,deepgram,soniox,mcp,sarvam,cartesia]==1.5.0",
    "loguru",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "langfuse",
    "asyncpg",
    "boto3",
    "google-cloud-storage>=2.10.0",
    "google-auth>=2.17.0",
    "cryptography>=44.0.1",
    "twilio",
    "plivo",
    "PyJWT",
    "bcrypt>=4.0.0",
    "pydub",
    "soundfile",
    "redis[hiredis]>=5.0.0",
    "nltk",
    "jmespath>=1.1.0",
    "h2>=4.3.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "tiktoken>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "autoflake",
    "pyrefly",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
combine_as_imports = true

[tool.pyrefly]
project-excludes = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
