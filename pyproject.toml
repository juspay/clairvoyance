[project]
name = "clairvoyance"
version = "0.1.0"
description = "Clairvoyance AI voice conversation platform"
requires-python = ">=3.11"
dependencies = [
    # <0.137: FastAPI 0.137 nests included routers (router.routes holds
    # _IncludedRouter wrappers, not APIRoutes), which the route-mount tests
    # walk. 0.136.x already runs on the patched Starlette 1.x.
    "fastapi>=0.115.12,<0.137",
    "uvicorn==0.34.2",
    # 3.10 is the floor for aiohttp.abc.ResolveResult, which the assist
    # engine's pinned resolver imports at module load; on an older aiohttp
    # that import fails and takes the whole service down at startup.
    "aiohttp>=3.10.0",
    "pytz==2025.2",
    "python-multipart>=0.0.6",
    "websockets>=11.0.3",
    "starlette>=0.27.0",
    "python-dotenv>=1.0.0",
    "pipecat-ai[daily,google,assemblyai,silero,openai,azure,elevenlabs,aic,anthropic,deepgram,soniox,mcp,sarvam,cartesia,aws,smallest]==1.1.0",
    "pipecat-ai-flows==1.0.0",
    "loguru",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "langfuse",
    "asyncpg",
    "boto3",
    "google-cloud-storage>=2.10.0",
    "google-auth>=2.17.0",
    "cryptography>=44.0.1",
    "twilio",
    "plivo",
    "PyJWT",
    "bcrypt>=4.0.0",
    "pydub",
    "soundfile",
    "redis[hiredis]>=5.0.0",
    "nltk",
    "jmespath>=1.1.0",
    "h2>=4.3.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "tiktoken>=0.13.0",
    "restrictedpython>=8.4",
    "num2words>=0.5.14",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "autoflake",
    "pyrefly",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
combine_as_imports = true

[tool.pyrefly]
# dragontts/ is a self-contained sub-service (own pyproject/venv, ported from a
# non-pyrefly repo) — exclude it from clairvoyance's type-check.
project-excludes = ["dragontts"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
# pipecat-ai 1.1.0 caps Pillow <13, but every Pillow 12.x carries open CVEs
# fixed only in 13.0.0. pipecat touches Pillow only through frombytes/open/
# save/tobytes, and pipecat 1.14+ itself allows Pillow 13. Drop this override
# once pipecat is bumped to a release that permits Pillow >=13.
override-dependencies = ["pillow>=13.0.0"]
