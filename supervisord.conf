[supervisord]
nodaemon=true
user=appuser

[program:backend]
command=python run.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=node build/index.js
directory=/app/frontend/loom
environment=NODE_ENV=production,PORT=5173,HOST=0.0.0.0,ORIGIN=http://0.0.0.0:5173
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
