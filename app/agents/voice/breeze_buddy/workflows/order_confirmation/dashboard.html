<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breeze Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0f4ff 50%, #f0e6ff 100%);
            color: #2d3748;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(0, 150, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(150, 100, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
            z-index: 1;
            animation: slideDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #0066cc 0%, #0099ff 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            margin-bottom: 10px;
            text-shadow: 0 20px 40px rgba(0, 100, 255, 0.05);
        }

        .subtitle {
            font-size: 1.1em;
            color: #666;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 50px;
            align-items: center;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
            animation: slideUp 0.8s ease-out 0.1s both;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .filters label {
            font-size: 0.95em;
            font-weight: 500;
            color: #555;
            letter-spacing: 0.5px;
        }

        .filters input {
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px solid rgba(0, 100, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.7);
            color: #2d3748;
            font-size: 0.95em;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .filters input:hover {
            border-color: rgba(0, 100, 255, 0.5);
            background-color: rgba(255, 255, 255, 0.9);
        }

        .filters input:focus {
            outline: none;
            border-color: #0099ff;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.2);
        }

        .filters input::placeholder {
            color: rgba(0, 0, 0, 0.3);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            padding: 30px 24px;
            backdrop-filter: blur(20px);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }
        .card:nth-child(6) { animation-delay: 0.6s; }
        .card:nth-child(n+7) { animation-delay: 0.7s; }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(0, 212, 255, 0.6);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.2),
                        0 0 40px rgba(0, 212, 255, 0.1);
        }

        .card h2 {
            margin: 0 0 20px 0;
            color: #a0aec0;
            font-size: 0.95em;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .card:hover h2 {
            color: #00d4ff;
        }

        .card p {
            font-size: 3.2em;
            margin: 0;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .card:hover p {
            font-size: 3.5em;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.4));
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }

            .filters {
                flex-direction: column;
                gap: 16px;
            }

            .filter-group {
                width: 100%;
            }

            .filters input {
                width: 100%;
            }

            .container {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 16px;
            }

            .card {
                padding: 20px 16px;
            }

            .card p {
                font-size: 2.2em;
            }

            .card:hover p {
                font-size: 2.4em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Breeze Buddy</h1>
        <p class="subtitle">Analytics Dashboard</p>
    </header>
    <div class="filters">
        <div class="filter-group">
            <label for="start-date">From:</label>
            <input type="date" id="start-date">
        </div>
        <div class="filter-group">
            <label for="end-date">To:</label>
            <input type="date" id="end-date">
        </div>
    </div>
    <div class="container" id="analytics-container">
    </div>

    <script>
        const startDateInput = document.getElementById('start-date');
        const endDateInput = document.getElementById('end-date');

        // Set start date to today by default
        const today = new Date().toISOString().split('T')[0];
        startDateInput.value = today;

        async function fetchAnalytics() {
            const startDate = startDateInput.value;
            const endDate = endDateInput.value;
            let url = '/agent/voice/breeze-buddy/breeze/order-confirmation/analytics';
            const params = new URLSearchParams();
            if (startDate) {
                params.append('start_date', startDate);
            }
            if (endDate) {
                params.append('end_date', endDate);
            }
            if (params.toString()) {
                url += `?${params.toString()}`;
            }

            const container = document.getElementById('analytics-container');
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                container.innerHTML = '';
                for (const [key, value] of Object.entries(data)) {
                const card = document.createElement('div');
                card.classList.add('card');
                const title = document.createElement('h2');
                title.textContent = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                const count = document.createElement('p');
                count.textContent = value;
                card.appendChild(title);
                card.appendChild(count);
                container.appendChild(card);
                }
            } catch (error) {
                console.error('Failed to fetch analytics:', error);
                container.innerHTML = '<div class="card"><h2>Error</h2><p>Failed to load analytics data</p></div>';
                return;
            }
        }

        startDateInput.addEventListener('change', fetchAnalytics);
        endDateInput.addEventListener('change', fetchAnalytics);

        fetchAnalytics();
    </script>
</body>
</html>
