<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Breeze Buddy</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(
          135deg,
          #f8fafc 0%,
          #e0f4ff 50%,
          #f0e6ff 100%
        );
        color: #2d3748;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(
            circle at 20% 50%,
            rgba(0, 150, 255, 0.08) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(150, 100, 255, 0.08) 0%,
            transparent 50%
          );
        pointer-events: none;
        z-index: 0;
      }

      .login-container {
        background: rgba(255, 255, 255, 0.8);
        padding: 60px 50px;
        border-radius: 28px;
        box-shadow: 0 40px 100px rgba(0, 100, 255, 0.15);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 2px solid rgba(255, 255, 255, 0.6);
        width: 100%;
        max-width: 510px;
        text-align: center;
        position: relative;
        z-index: 1;
        animation: slideInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 4em;
        font-weight: 700;
        background: linear-gradient(
          135deg,
          #0066cc 0%,
          #0099ff 50%,
          #6366f1 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -2.5px;
        margin-bottom: 15px;
        position: relative;
        animation: fadeInDown 0.8s ease-out;
      }

      h1::after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 3px;
        background: linear-gradient(90deg, transparent, #0099ff, transparent);
        border-radius: 2px;
      }

      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .subtitle {
        font-size: 1em;
        color: #718096;
        font-weight: 500;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 45px;
        opacity: 0.85;
        animation: fadeIn 1s ease-out 0.2s both;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 0.85;
        }
      }

      form {
        animation: fadeInUp 0.8s ease-out 0.3s both;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .input-group {
        margin-bottom: 28px;
        text-align: left;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: #4a5568;
        font-size: 0.9em;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        font-size: 0.85em;
      }

      input {
        width: 100%;
        padding: 16px 22px;
        border-radius: 12px;
        border: 2px solid rgba(0, 100, 255, 0.15);
        background-color: rgba(255, 255, 255, 0.9);
        font-size: 1em;
        font-family: "Inter", sans-serif;
        color: #2d3748;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      input:hover {
        border-color: rgba(0, 100, 255, 0.3);
        background-color: #ffffff;
        transform: translateY(-1px);
      }

      input:focus {
        outline: none;
        border-color: #0099ff;
        background-color: #ffffff;
        box-shadow: 0 0 0 4px rgba(0, 150, 255, 0.1),
          0 8px 24px rgba(0, 150, 255, 0.15);
        transform: translateY(-2px);
      }

      input::placeholder {
        color: rgba(0, 0, 0, 0.3);
      }

      button {
        width: 100%;
        padding: 18px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #0099ff, #6366f1);
        color: white;
        font-size: 1.1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: "Inter", sans-serif;
        letter-spacing: 0.5px;
        margin-top: 10px;
        position: relative;
        overflow: hidden;
      }

      button::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }

      button:hover::before {
        width: 300px;
        height: 300px;
      }

      button:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(0, 150, 255, 0.35);
      }

      button:active {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(0, 150, 255, 0.3);
      }

      .error-message {
        color: #dc3545;
        background: rgba(220, 53, 69, 0.1);
        padding: 14px 18px;
        border-radius: 10px;
        margin-top: 20px;
        display: none;
        font-size: 0.95em;
        font-weight: 500;
        border: 1px solid rgba(220, 53, 69, 0.2);
        animation: shake 0.5s ease-in-out;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-10px);
        }
        75% {
          transform: translateX(10px);
        }
      }

      @media (max-width: 768px) {
        body {
          padding: 30px 20px;
        }

        .login-container {
          padding: 45px 35px;
          max-width: 100%;
        }

        h1 {
          font-size: 3em;
          letter-spacing: -2px;
        }

        .subtitle {
          font-size: 0.95em;
          margin-bottom: 35px;
        }

        input {
          padding: 14px 18px;
        }

        button {
          padding: 16px;
          font-size: 1em;
        }
      }

      @media (max-width: 480px) {
        .login-container {
          padding: 35px 25px;
        }

        h1 {
          font-size: 2.5em;
        }

        .subtitle {
          font-size: 0.9em;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h1>Breeze Buddy</h1>
      <p class="subtitle">Admin Login</p>
      <form id="login-form">
        <div class="input-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            placeholder="Enter your username"
          />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Enter your password"
          />
        </div>
        <button type="submit">Login</button>
        <p id="error-message" class="error-message"></p>
      </form>
    </div>

    <script>
      document
        .getElementById("login-form")
        .addEventListener("submit", async function (event) {
          event.preventDefault();
          const username = event.target.username.value;
          const password = event.target.password.value;
          const errorMessage = document.getElementById("error-message");

          try {
            const response = await fetch("/agent/voice/breeze-buddy/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ username, password }),
            });

            if (response.ok) {
              window.location.href =
                "/agent/voice/breeze-buddy/breeze/order-confirmation/dashboard";
            } else {
              const data = await response.json();
              errorMessage.textContent =
                data.detail || "Invalid username or password";
              errorMessage.style.display = "block";
            }
          } catch (error) {
            errorMessage.textContent = "An error occurred. Please try again.";
            errorMessage.style.display = "block";
          }
        });
    </script>
  </body>
</html>
